server {
    listen 80;
    server_name _;

    location /weekly_charts/ {
        alias /usr/share/nginx/html/weekly_charts/;
        autoindex on;
    }

    location /daily_charts/ {
        alias /usr/share/nginx/html/daily_charts/;
        autoindex on;
    }

    location /md/ {
        alias /usr/share/nginx/html/md/;
        index index.html;
        autoindex on;
    }

    location = /api/stop-loss {
        proxy_pass http://127.0.0.1:8080;
    }

    location = /api/daily-stop-loss {
        proxy_pass http://127.0.0.1:8080;
    }

    location = /api/buy-point {
        proxy_pass http://127.0.0.1:8080;
    }

    location = /api/daily-swing-low {
        proxy_pass http://127.0.0.1:8080;
    }

    location = /regenerate {
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ =404;
    }
}